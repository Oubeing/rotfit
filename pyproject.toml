[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rotfit"
version = "1.0.0"
description = "从角度序列反演旋转轴方向与旋转顺序的可微优化工具包"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rotation", "axis", "inverse-problem", "sinkhorn", "pytorch", "kinematics"]
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "openpyxl",
]

[project.optional-dependencies]
viz = ["matplotlib"]
train-ui = ["tensorboard"]

# 说明：命令行入口统一用 `python scripts/train.py`（脚本会自动切到项目根目录，
# 保证 data/、results/ 等相对路径可用），因此这里不注册 console_scripts。

[tool.setuptools]
packages = ["rotfit", "rotfit.core", "rotfit.models", "rotfit.utils"]
